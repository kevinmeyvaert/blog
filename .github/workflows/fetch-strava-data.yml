name: Fetch Strava Data

on:
  schedule:
    # Run daily at 3 AM UTC (after Discogs at 2 AM)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-strava:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh Strava access token
        id: refresh_token
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          # Refresh the access token
          RESPONSE=$(curl -X POST https://www.strava.com/oauth/token \
            -d client_id=$STRAVA_CLIENT_ID \
            -d client_secret=$STRAVA_CLIENT_SECRET \
            -d refresh_token=$STRAVA_REFRESH_TOKEN \
            -d grant_type=refresh_token)

          # Extract the new access token
          ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.access_token')
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "Access token refreshed successfully"

      - name: Fetch Strava athlete data
        env:
          ACCESS_TOKEN: ${{ steps.refresh_token.outputs.ACCESS_TOKEN }}
        run: |
          # Create _data directory if it doesn't exist
          mkdir -p _data

          # Fetch athlete profile
          echo "Fetching athlete profile..."
          curl -H "Authorization: Bearer $ACCESS_TOKEN" \
               "https://www.strava.com/api/v3/athlete" \
               -o _data/athlete.json

          # Fetch athlete stats
          ATHLETE_ID=$(cat _data/athlete.json | jq -r '.id')
          echo "Fetching athlete stats for ID: $ATHLETE_ID"
          curl -H "Authorization: Bearer $ACCESS_TOKEN" \
               "https://www.strava.com/api/v3/athletes/$ATHLETE_ID/stats" \
               -o _data/athlete_stats.json

      - name: Fetch all activities
        env:
          ACCESS_TOKEN: ${{ steps.refresh_token.outputs.ACCESS_TOKEN }}
        run: |
          echo "Fetching all activities with pagination..."
          PAGE=1
          echo "[]" > _data/activities_raw.json

          while true; do
            echo "Fetching page $PAGE..."
            curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
                 "https://www.strava.com/api/v3/athlete/activities?per_page=200&page=$PAGE" \
                 -o _data/activities_page.json

            COUNT=$(jq length _data/activities_page.json)
            echo "Page $PAGE: $COUNT activities"

            if [ "$COUNT" -eq 0 ]; then
              echo "No more activities found. Done!"
              break
            fi

            jq -s '.[0] + .[1]' _data/activities_raw.json _data/activities_page.json > _data/activities_merged.json
            mv _data/activities_merged.json _data/activities_raw.json
            rm -f _data/activities_page.json

            PAGE=$((PAGE + 1))

            sleep 1
          done

          TOTAL=$(jq length _data/activities_raw.json)
          echo "Total activities fetched: $TOTAL"

      - name: Process and aggregate data
        run: |
          # Install jq if not available (should be pre-installed on ubuntu-latest)
          # Combine all data into a single structured JSON file

          cat > _data/strava.json << 'EOF'
          {
            "last_updated": "",
            "athlete": {},
            "stats": {},
            "activities": [],
            "aggregated": {
              "weekly": [],
              "monthly": []
            }
          }
          EOF

          # Add timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Process the data using jq
          jq -n \
            --arg timestamp "$TIMESTAMP" \
            --slurpfile athlete _data/athlete.json \
            --slurpfile stats _data/athlete_stats.json \
            --slurpfile activities _data/activities_raw.json \
            '{
              last_updated: $timestamp,
              athlete: ($athlete[0] | del(.city, .state, .country)),
              stats: $stats[0],
              activities: [$activities[0][] | del(.start_latlng, .end_latlng, .map, .location_city, .location_state, .location_country)],
              aggregated: {
                weekly: (
                  $activities[0]
                  | group_by(.start_date[:10] | strptime("%Y-%m-%d") | strftime("%Y-W%U"))
                  | map({
                      week: .[0].start_date[:10] | strptime("%Y-%m-%d") | strftime("%Y-W%U"),
                      total_distance: (map(.distance) | add),
                      total_time: (map(.moving_time) | add),
                      total_elevation: (map(.total_elevation_gain) | add),
                      activity_count: length
                    })
                ),
                monthly: (
                  $activities[0]
                  | group_by(.start_date[:7])
                  | map({
                      month: .[0].start_date[:7],
                      total_distance: (map(.distance) | add),
                      total_time: (map(.moving_time) | add),
                      total_elevation: (map(.total_elevation_gain) | add),
                      activity_count: length
                    })
                )
              }
            }' > _data/strava.tmp.json

          # Move temp file to final location
          mv _data/strava.tmp.json _data/strava.json

          # Clean up temporary files
          rm -f _data/athlete.json _data/athlete_stats.json _data/activities_raw.json _data/activities_page.json _data/activities_merged.json

          echo "Strava data processed successfully"

      - name: Fetch Ward kudo data
        env:
          ACCESS_TOKEN: ${{ steps.refresh_token.outputs.ACCESS_TOKEN }}
        run: |
          echo "Fetching kudos for recent activities to check Ward's loyalty..."
          WARD_FIRSTNAME="Ward"
          PERIOD_START="2026-03-24"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RECHECK_SINCE=$(date -u -d "7 days ago" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v-7d +"%Y-%m-%dT%H:%M:%SZ")

          # Runs in the period, with fresh metadata from strava.json
          jq --arg cutoff "$PERIOD_START" \
            '[.activities[] | select(.type == "Run" and .start_date >= ($cutoff + "T00:00:00Z")) | {activity_id: .id, name: .name, date: .start_date_local, distance: .distance, moving_time: .moving_time, kudos_count: .kudos_count}]' \
            _data/strava.json > /tmp/runs.json

          # Verdicts we already know from the previous run
          if [ -f _data/ward_kudos.json ]; then
            jq '[.activities[] | {key: (.activity_id | tostring), value: .ward_kudoed}] | from_entries' \
              _data/ward_kudos.json > /tmp/known_verdicts.json
          else
            echo '{}' > /tmp/known_verdicts.json
          fi

          # Strava allows 100 reads per 15 min, so only call the API for runs without a
          # verdict, plus recent runs Ward may still kudo
          FETCH_IDS=$(jq -r --slurpfile known /tmp/known_verdicts.json --arg recheck "$RECHECK_SINCE" \
            '.[] | (.activity_id | tostring) as $key | select(($known[0][$key] == null) or ($known[0][$key] == false and .date >= $recheck)) | .activity_id' \
            /tmp/runs.json)

          echo '{}' > /tmp/new_verdicts.json

          for AID in $FETCH_IDS; do
            echo "Checking kudos for activity $AID..."
            curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.strava.com/api/v3/activities/$AID/kudos?per_page=200" \
              -o /tmp/kudos_response.json

            if ! jq -e 'type == "array"' /tmp/kudos_response.json > /dev/null 2>&1; then
              echo "::warning::Unexpected kudos response for $AID, keeping known verdicts: $(cat /tmp/kudos_response.json)"
              break
            fi

            WARD_KUDOED=$(jq --arg name "$WARD_FIRSTNAME" \
              '[.[] | select(.firstname == $name)] | length > 0' \
              /tmp/kudos_response.json)

            jq --arg aid "$AID" --argjson ward "$WARD_KUDOED" '.[$aid] = $ward' \
              /tmp/new_verdicts.json > /tmp/new_verdicts_tmp.json
            mv /tmp/new_verdicts_tmp.json /tmp/new_verdicts.json

            sleep 0.5
          done

          jq -s '.[0] * .[1]' /tmp/known_verdicts.json /tmp/new_verdicts.json > /tmp/verdicts.json

          jq -n \
            --arg timestamp "$TIMESTAMP" \
            --arg period_start "$PERIOD_START" \
            --arg ward_name "$WARD_FIRSTNAME" \
            --slurpfile runs /tmp/runs.json \
            --slurpfile verdicts /tmp/verdicts.json \
            '$verdicts[0] as $v
            | [$runs[0][] | . + {ward_kudoed: ($v[.activity_id | tostring] // false)}] as $activities
            | ($activities | length) as $total
            | ([$activities[] | select(.ward_kudoed)] | length) as $ward_count
            | {
              last_updated: $timestamp,
              ward_name: $ward_name,
              period_start: $period_start,
              activities: $activities,
              summary: {
                total_runs: $total,
                ward_kudos: $ward_count,
                loyalty_pct: (if $total == 0 then 0 else (($ward_count * 1000 / $total) | round) / 10 end)
              }
            }' > _data/ward_kudos.json

          jq -r '"Ward kudoed \(.summary.ward_kudos)/\(.summary.total_runs) runs (\(.summary.loyalty_pct)%)"' _data/ward_kudos.json
          rm -f /tmp/kudos_response.json /tmp/runs.json /tmp/known_verdicts.json /tmp/new_verdicts.json /tmp/verdicts.json

      - name: Check for changes
        id: check_changes
        run: |
          git status --porcelain _data/ | grep -q . && echo "changed=true" >> $GITHUB_OUTPUT || true

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/strava.json _data/ward_kudos.json
          git commit -m "chore: update strava data"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "No changes to Strava data detected. Skipping commit and deployment."
